name: CopilotAuto

on:
  push:
    paths: ['copilotauto/**', '.github/workflows/copilotauto.yml']
  pull_request:
    paths: ['copilotauto/**', '.github/workflows/copilotauto.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: copilotauto/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: copilotauto/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx jest
