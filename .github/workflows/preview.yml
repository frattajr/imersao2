name: Preview web (GitHub Pages)

on:
  push:
    branches: [main, claude/github-project-preview-o2jd93]
  workflow_dispatch:
  # toda segunda-feira: atualiza a cópia do catálogo do Project Gutenberg
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
      - run: npx tsc --noEmit
      - run: npx jest
      - name: Exportar para a web em /<repo>/
        run: |
          node -e "const f='app.json',j=require('./'+f);j.expo.experiments.baseUrl='/${{ github.event.repository.name }}';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          npx expo export --platform web
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      # pacote inicial de stems (ElevenLabs): gerado uma vez e guardado em cache;
      # precisa do segredo ELEVENLABS_API_KEY no repositório (Settings → Secrets → Actions)
      - uses: actions/cache@v4
        with:
          path: .stems-cache
          key: stems-${{ hashFiles('scripts/build-stems.ts', 'src/data/classics.ts', 'src/core/scenery.ts', 'src/core/sound.ts') }}
          restore-keys: stems-
      - name: Pacote inicial de stems
        timeout-minutes: 25
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          bun scripts/build-stems.ts .stems-cache --max 80
          mkdir -p dist/stems && cp -r .stems-cache/. dist/stems/
      - name: Copiar catálogo e livros do Project Gutenberg
        timeout-minutes: 20
        continue-on-error: true
        run: |
          bun scripts/verify-gutenberg.ts
          GUT_TEXTS=60 bun scripts/build-gutenberg.ts dist/gutenberg
      - name: Acervo curado de clássicos em português
        timeout-minutes: 15
        continue-on-error: true
        run: bun scripts/build-acervo.ts dist/acervo
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
